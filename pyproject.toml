[project]
name = "cadence-core"
version = "0.1.0"
description = "Asset-agnostic core for the Cadence trading platform: calibrated judgment (Jev), Brier/ECE calibration, context digest and a macro context engine. Capability showcase — no real money."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Deliberately dependency-light: the judgment/calibration layer is pure Python,
# the HTTP layer uses the standard library, and the macro sources (FRED, ECB) are
# keyless. python-dotenv is optional (tests run without it).
dependencies = [
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadence_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
